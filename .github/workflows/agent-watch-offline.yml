name: Agent watch offline safety
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.93.1
      - name: First offline pass (no application build or launch)
        run: |
          cargo test --manifest-path scripts/agent-watch-harness/Cargo.toml --locked
          node --test scripts/agent-watch-contract.test.mjs src-tauri/resources/agent_watch_sidecar/lifecycle.test.cjs
      - name: Repeat offline pass
        run: |
          cargo test --manifest-path scripts/agent-watch-harness/Cargo.toml --locked
          node --test scripts/agent-watch-contract.test.mjs src-tauri/resources/agent_watch_sidecar/lifecycle.test.cjs
      - name: Remove safety rules and require assertion failures
        run: python scripts/agent-watch-mutations.py
