name: ci

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["**"]

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

      - name: Run frontend tests
        run: npm test

      - name: Turn-end choke-point gate (ghost hot-mic loop)
        run: node ../scripts/check-turn-ends.mjs

      - name: Repo hygiene gate self-test (secret rules fire on synthetic samples)
        run: node ../scripts/check-repo-hygiene.mjs --selftest

      - name: Repo hygiene gate (no tracked secrets, databases, logs, key files)
        run: node ../scripts/check-repo-hygiene.mjs

      # Every text/surface pair of the design tokens, dark and light, against WCAG 2.2 AA.
      - name: Theme contrast gate
        run: node ../scripts/check-theme-contrast.mjs

      # Colours live in theme/tokens.css; a stylesheet may not add hex/rgb/hsl values (baseline may only shrink).
      - name: Hard-coded colour ratchet
        run: node ../scripts/check-hardcoded-colors.mjs

      # Commands defined/registered/invoked and events emitted/listened must agree;
      # the one-sided leftovers are frozen in scripts/baselines/ and may only shrink.
      - name: IPC + event contract gate
        run: node ../scripts/check-ipc-contract.mjs

  worker-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/worker/package-lock.json

      - name: Install Worker deps
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Worker tests
        run: npm test
  voice-accuracy-tools:
    # Wake-word data gate + the stdlib/numpy tests of the evaluation and training tools.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Wake model manifest + data gate
        run: python scripts/wake_data_foundation.py validate

      - name: Evaluation tool tests (stdlib)
        run: |
          python -m unittest scripts/test_voice_eval_tools.py
          python -m unittest scripts/test_wake_dsp.py
          python -m unittest scripts/test_wake_score.py
          python -m unittest scripts/test_wake_improve.py

      - name: Trainer library tests (numpy / scipy / onnxruntime)
        run: |
          pip install numpy scipy onnxruntime
          python -m unittest scripts/test_wake_train_lib.py
          python -m unittest scripts/test_wake_label_audit.py
          python -m unittest scripts/test_wake_data_fetch.py
          python -m unittest scripts/test_wake_data_synth.py

  windows-installer:
    runs-on: windows-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/phase-1')
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install LLVM
        run: choco install llvm -y

      - name: Set LIBCLANG_PATH
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Run Rust tests on Windows
        working-directory: src-tauri
        run: |
          cargo test --lib -- --test-threads=1

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build Windows installer (.exe + .msi)
        run: npx --yes @tauri-apps/cli build
        env:
          # NSIS installer + MSI installer both produced
          TAURI_BUNDLE: "nsis,msi"

      - name: Verify installers were created
        run: |
          Get-ChildItem src-tauri\target\release\bundle\nsis\*.exe -ErrorAction SilentlyContinue | ForEach-Object { Write-Output "NSIS: $($_.Name) — $([math]::Round($_.Length/1MB,1)) MB" }
          Get-ChildItem src-tauri\target\release\bundle\msi\*.msi -ErrorAction SilentlyContinue | ForEach-Object { Write-Output "MSI: $($_.Name) — $([math]::Round($_.Length/1MB,1)) MB" }

      - name: Upload Windows NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: nexus-windows-exe
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Windows MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: nexus-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 7

  rust-check-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM
        run: choco install llvm -y

      - name: Set LIBCLANG_PATH
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri::generate_context! with the custom-protocol feature embeds frontend/dist at compile time
      # and panics if the folder is missing. The frontend is built by frontend-check; this job only
      # needs the folder to exist to type-check and test the Rust side.
      - name: Placeholder frontend/dist (embedded-assets build needs the folder)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force frontend/dist | Out-Null
          Set-Content frontend/dist/index.html "<!doctype html><title>ci</title>"

      - name: Cargo check (default)
        working-directory: src-tauri
        run: cargo check

      - name: Cargo check (mock-wake)
        working-directory: src-tauri
        run: cargo check --features mock-wake

      # The shipped binary is built with these features (nexus build); they were
      # never compiled in CI before, so breakage there was only found locally.
      - name: Cargo check (shipped features, ALL targets incl. tests, examples, dev_tools)
        working-directory: src-tauri
        run: cargo check --all-targets --features custom-protocol,admin-brain

      # rustc --force-warn dead_code sees through #[allow(dead_code)]; lib.rs only
      # publishes the modules in scripts/baselines/external-api.txt so unused pub
      # items are visible. New dead code fails; the baseline may only shrink.
      - name: Dead-code ratchet
        run: node scripts/dead-code-audit.mjs

      # --tests = lib unit tests + everything in src-tauri/tests (the 50-command
      # voice fixture, offline commands, user commands). Previously only --lib ran.
      - name: Cargo test (lib + integration tests)
        working-directory: src-tauri
        run: cargo test --tests --features custom-protocol,admin-brain -- --test-threads=1

  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install NLU server deps
        working-directory: server/nlu
        run: pip install -r requirements.txt

      - name: Check NLU server parses
        working-directory: server
        run: python -c "import ast; ast.parse(open('nlu_server.py').read()); print('NLU server parses OK')"

      - name: Check STT server parses
        working-directory: server
        run: python -c "import ast; ast.parse(open('stt_server.py').read()); print('STT server parses OK')"

      - name: Check NLU train script parses
        working-directory: server/nlu
        run: python -c "import ast; ast.parse(open('train.py').read()); print('train.py parses OK')"

      - name: Check sidecar modules parse
        working-directory: server/sidecar
        run: |
          python -c "import ast; [ast.parse(open(f).read()) for f in ['sidecar.py','tts.py','oauth.py','db.py','n8n_client.py']]; print('All sidecar modules parse OK')"

      - name: Validate n8n blueprints
        working-directory: server/n8n
        run: |
          python -c "import json; [json.load(open(f)) for f in ['master_supervisor.blueprint.json','email_summarize.blueprint.json','github_pr_check.blueprint.json','calendar_peek.blueprint.json','general_chat.blueprint.json']]; print('All blueprints are valid JSON')"

      - name: Validate NLU Data Foundation
        run: python server/nlu/data_foundation.py validate

      - name: Agent + memory unit tests
        working-directory: server
        run: |
          pip install pytest -r agent/requirements.txt
          python -m pytest agent/tests memory/tests -q
