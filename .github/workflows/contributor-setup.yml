name: Contributor setup
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, ubuntu-24.04]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: CLI and provenance regression tests (no app launch)
        run: node --test scripts/contributor-cli.test.mjs scripts/contributor-contract.test.mjs scripts/build-provenance.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python lock structural tests
        run: python -m unittest scripts/test_contributor_lock.py
      - name: Safety mutations
        run: node scripts/contributor-mutation-check.mjs
  native-builds:
    # Explicit owner-triggered qualification; never represented as device/live proof.
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.93.1'
      - name: Prepare and build from a clean checkout
        run: node nexus.mjs build --yes
      - name: Repeat build without deleting caches
        run: node nexus.mjs build --yes
      - name: Native and frontend tests
        run: node nexus.mjs test
      - name: Dependency lockfiles must remain unchanged
        run: git diff --exit-code -- frontend/package-lock.json src-tauri/Cargo.lock
      - uses: actions/upload-artifact@v4
        with:
          name: contributor-build-record-${{ matrix.os }}
          path: src-tauri/target-contributor/release/nexus-build.json
          if-no-files-found: error
