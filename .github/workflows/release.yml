name: release

# A tag push (vX.Y.Z) builds the FAMILY installers (personal profile, no admin-brain) for each platform,
# checks the version and the installer download pins first, then a final job writes SHA256SUMS.txt and
# creates a DRAFT GitHub release for the owner to review and publish by hand (plan 194).
# workflow_dispatch builds the same artifacts without creating a release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,  target: "",                              bundle: "nsis,msi" }
          - { os: macos-15,        target: "aarch64-apple-darwin",          bundle: "dmg" }
          - { os: ubuntu-24.04,    target: "",                              bundle: "appimage,deb" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Gates run before the long build so a mismatch fails in seconds.
      - name: Version gate (tag must match tauri.conf.json, Cargo.toml and package.json)
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/sync-version.mjs --check --tag "${{ github.ref_name }}"

      - name: Version gate (files agree)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: node scripts/sync-version.mjs --check

      # A tagged release refuses an unpinned Python download; a manual dry run only warns.
      - name: Installer download pins
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            node scripts/check-installer-pins.mjs --strict
          else
            node scripts/check-installer-pins.mjs
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.1"
          targets: ${{ matrix.target }}

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libssl-dev pkg-config build-essential libxdo-dev libdbus-1-dev

      - name: Install frontend deps
        run: npm --prefix frontend ci

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Build Tauri app (family installer)
        env:
          NEXUS_SERVER_URL: https://nexus-worker.chitkullakshya.workers.dev
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: pwsh
        run: pwsh ./scripts/build.ps1 -Profile personal -Yes -Target "${{ matrix.target }}" -Bundles "${{ matrix.bundle }}"

      - uses: actions/upload-artifact@v4
        with:
          name: NEXUS-${{ matrix.os }}-${{ matrix.target || 'native' }}
          path: |
            src-tauri/target-personal/**/bundle/**
            src-tauri/target-personal/release/bundle/**
          if-no-files-found: error

  # Draft only: the owner reads the notes and the checksums, then publishes by hand.
  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect installers and write checksums
        shell: bash
        run: |
          mkdir -p release-out
          find artifacts -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) \
            -not -path '*/_up_/*' -exec cp {} release-out/ \;
          if [ -z "$(ls -A release-out)" ]; then echo "No installer was produced"; exit 1; fi
          (cd release-out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: NEXUS-release-files
          path: release-out/*
          if-no-files-found: error

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft --title "NEXUS ${{ github.ref_name }}" --generate-notes release-out/*
