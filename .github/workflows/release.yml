name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,  target: "",                              bundle: "nsis" }
          - { os: macos-15,        target: "aarch64-apple-darwin",          bundle: "dmg" }
          - { os: ubuntu-24.04,    target: "",                              bundle: "appimage,deb" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.1"
          targets: ${{ matrix.target }}

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libssl-dev pkg-config build-essential libxdo-dev libdbus-1-dev

      - name: Install frontend deps
        run: npm --prefix frontend ci

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Build Tauri app
        env:
          NEXUS_SERVER_URL: https://nexus-worker.chitkullakshya.workers.dev
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: pwsh
        run: pwsh ./scripts/build.ps1 -Profile personal -Yes -Target "${{ matrix.target }}" -Bundles "${{ matrix.bundle }}"

      - uses: actions/upload-artifact@v4
        with:
          name: NEXUS-${{ matrix.os }}-${{ matrix.target || 'native' }}
          path: |
            src-tauri/target-personal/**/bundle/**
            src-tauri/target-personal/release/bundle/**
          if-no-files-found: error
