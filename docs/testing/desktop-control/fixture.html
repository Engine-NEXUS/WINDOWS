<!doctype html><html lang="en"><meta charset="utf-8"><title>NEXUS local desktop fixture</title>
<style>body{font:18px system-ui;padding:24px}section{padding:18px;border:1px solid;margin:12px 0}input,button{font:inherit;padding:8px}#scroll{height:160px;overflow:auto}#tools[hidden]{display:none}</style>
<h1>NEXUS desktop-control fixture</h1><p>This page makes no network requests and submits nothing.</p>
<section aria-label="Toolbar"><h2>Toolbar</h2><button id="open-one">Open</button><button id="tools-button">Tools</button>
<div role="menu" aria-label="Tools" id="tools" hidden><button role="menuitem">Inspect fixture</button></div></section>
<section aria-label="Document"><h2>Document</h2><button id="open-two">Open</button><label><input type="checkbox" id="toggle">Fixture checkbox</label>
<label>Fixture text <input id="text" aria-label="Fixture text" autocomplete="off"></label><p id="result" role="status">No action yet</p><div role="dialog" aria-label="Open" id="opened" hidden><h2>Open</h2><p>Fixture opened.</p></div></section>
<section><h2>Scrollable fixture</h2><div id="scroll" tabindex="0" aria-label="Fixture scroll pane"></div></section>
<script>
for(const id of ['open-one','open-two'])document.getElementById(id).onclick=()=>{document.getElementById('result').textContent=id+' activated';document.getElementById('opened').hidden=false;}
document.getElementById('tools-button').onclick=()=>setTimeout(()=>document.getElementById('tools').hidden=false,750);
for(let n=1;n<=100;n++){const p=document.createElement('p');p.textContent='Fixture row '+n;document.getElementById('scroll').append(p)}
</script></html>
