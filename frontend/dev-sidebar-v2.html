<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXUS sidebar v2 — GitHub dashboard inspired</title>
<!-- Dev playground (served by `npm run dev` only). v2 of the sidebar system, built from what makes the GitHub dashboard sidebar work:
     a contribution heatmap, an activity breakdown, a Quick Access tile grid with count badges, feed cards with a type tag, a repo tag
     and an attribution row, drill-down pages with a back header, a footer bar with the keys, and a thin loading bar.
     Two palettes: "GitHub" (the dashboard's own light and dark dimmed palettes) and "Mono" (black, white, grey). Mock data only. -->
<style>
  :root { --font: "Segoe UI Variable Text", "Segoe UI", -apple-system, "Inter", system-ui, sans-serif; --mono: ui-monospace, "Cascadia Mono", Consolas, monospace; --ease: cubic-bezier(.22,1,.36,1); --r: 12px; }
  /* palettes */
  [data-pal="gh"][data-theme="dark"]  { --bg:#0d1117; --sf:#161b22; --sf2:#21262d; --bd:#30363d; --bd2:#21262d; --tx:#e6edf3; --tx2:#8b949e; --tx3:#6e7681; --ac:#4493f8; --acs:rgba(56,139,253,.15); --ok:#3fb950; --err:#f85149; --warn:#d29922; --h0:#161b22; --h1:#0e4429; --h2:#006d32; --h3:#26a641; --h4:#39d353; --on-ac:#fff; --sh:0 1px 4px rgba(0,0,0,.5); color-scheme:dark; }
  [data-pal="gh"][data-theme="light"] { --bg:#f6f8fa; --sf:#ffffff; --sf2:#f1f3f5; --bd:#d0d7de; --bd2:#eaeef2; --tx:#1f2328; --tx2:#656d76; --tx3:#8c959f; --ac:#0969da; --acs:rgba(9,105,218,.1); --ok:#1a7f37; --err:#cf222e; --warn:#9a6700; --h0:#ebedf0; --h1:#9be9a8; --h2:#40c463; --h3:#30a14e; --h4:#216e39; --on-ac:#fff; --sh:0 1px 3px rgba(31,35,40,.08); color-scheme:light; }
  [data-pal="mono"][data-theme="dark"]  { --bg:#0b0b0d; --sf:#151519; --sf2:#1d1d22; --bd:rgba(255,255,255,.1); --bd2:rgba(255,255,255,.06); --tx:#f5f5f7; --tx2:rgba(255,255,255,.64); --tx3:rgba(255,255,255,.42); --ac:#ffffff; --acs:rgba(255,255,255,.1); --ok:#ffffff; --err:#ffffff; --warn:#ffffff; --h0:#1d1d22; --h1:#3a3a40; --h2:#6b6b73; --h3:#a6a6ad; --h4:#ffffff; --on-ac:#000; --sh:0 10px 30px -16px rgba(0,0,0,.8); color-scheme:dark; }
  [data-pal="mono"][data-theme="light"] { --bg:#eeeef0; --sf:#ffffff; --sf2:#f3f3f5; --bd:rgba(0,0,0,.1); --bd2:rgba(0,0,0,.06); --tx:#0b0b0d; --tx2:rgba(0,0,0,.62); --tx3:rgba(0,0,0,.4); --ac:#0b0b0d; --acs:rgba(0,0,0,.07); --ok:#0b0b0d; --err:#0b0b0d; --warn:#0b0b0d; --h0:#e4e4e8; --h1:#bdbdc4; --h2:#8a8a92; --h3:#4b4b52; --h4:#0b0b0d; --on-ac:#fff; --sh:0 10px 26px -18px rgba(0,0,0,.35); color-scheme:light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0a0a0c; color: #e8e8ea; font-family: var(--font); -webkit-font-smoothing: antialiased; }
  body { display: grid; grid-template-columns: 290px 1fr; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--ac); outline-offset: 2px; }
  *::-webkit-scrollbar { display: none; } * { scrollbar-width: none; }

  /* ── lab ── */
  #lab { padding: 20px 16px; border-right: 1px solid #26262b; overflow-y: auto; background: #101012; }
  #lab h1 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 4px; }
  #lab .sub { margin: 0 0 14px; color: #9a9aa2; font-size: 12px; line-height: 1.45; }
  #lab h2 { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: #6f6f78; margin: 16px 0 8px; }
  .nav button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; margin-bottom: 3px; background: transparent; border: 1px solid transparent; border-radius: 9px; text-align: left; font-size: 13px; color: #b4b4bb; }
  .nav button[aria-pressed=true] { background: #f2f2f4; color: #0b0b0d; font-weight: 600; }
  .nav .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; opacity: .5; flex: none; }
  .seg { display: flex; border: 1px solid #2c2c32; border-radius: 9px; overflow: hidden; }
  .seg button { flex: 1; padding: 7px 4px; border: 0; background: transparent; font-size: 12px; color: #a4a4ac; }
  .seg button[aria-pressed=true] { background: #f2f2f4; color: #0b0b0d; font-weight: 600; }
  #notes { margin-top: 4px; padding: 12px; border: 1px solid #2c2c32; border-radius: 12px; font-size: 12px; line-height: 1.5; color: #a4a4ac; }
  #notes b { color: #f2f2f4; display: block; margin-bottom: 4px; } #notes ul { margin: 6px 0 0; padding-left: 16px; } #notes li { margin: 3px 0; }

  /* ── stage and frame ── */
  #stage { display: grid; place-items: center; padding: 22px; background: #202024; min-width: 0; }
  body[data-theme="light"] #stage { background: #c8c9ce; }
  #frame { width: var(--w, 420px); height: min(960px, calc(100vh - 44px)); display: flex; flex-direction: column; position: relative; background: var(--bg); color: var(--tx); border: 1px solid var(--bd); border-radius: 14px; overflow: hidden; box-shadow: 0 30px 80px -20px rgba(0,0,0,.6); container-type: inline-size; transition: width .35s var(--ease); }
  #loadbar { position: absolute; top: 0; left: 0; right: 0; height: 2px; overflow: hidden; z-index: 5; pointer-events: none; }
  #loadbar i { position: absolute; inset: 0 auto 0 0; width: 35%; background: var(--ac); opacity: 0; }
  #loadbar.on i { opacity: 1; animation: sweep .7s var(--ease) 1; }
  @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(300%); } }

  /* header: icon, title, subtitle chip. No dock arrows, no close (arrow keys and Esc do that). */
  .hdr { display: flex; align-items: center; gap: 12px; padding: 15px 16px 13px; background: var(--sf); border-bottom: 1px solid var(--bd); flex: none; }
  .hdr .lg { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--acs); color: var(--ac); flex: none; }
  .hdr .lg svg { width: 20px; height: 20px; }
  .hdr .tt { flex: 1; min-width: 0; } .hdr .tt b { display: block; font-size: 16px; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hdr .tt span { display: block; font-size: 12px; color: var(--tx2); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .back { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px 5px 8px; border-radius: 8px; border: 1px solid var(--bd); background: var(--sf2); color: var(--tx2); font-size: 12px; font-weight: 600; }
  .back svg { width: 14px; height: 14px; transform: scaleX(-1); }

  #body { flex: 1; overflow-y: auto; padding: 14px; display: grid; gap: 12px; align-content: start; scroll-behavior: smooth; }
  .foot { flex: none; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 12px; background: var(--sf); border-top: 1px solid var(--bd); font-size: 11.5px; color: var(--tx3); }
  .foot kbd, .k { font: 600 10.5px var(--mono); padding: 2px 6px; border-radius: 6px; background: var(--sf2); border: 1px solid var(--bd); color: var(--tx2); }
  .pin-actions { flex: none; display: flex; gap: 10px; padding: 11px 14px; background: var(--sf); border-top: 1px solid var(--bd); }

  /* ── building blocks ── */
  .sec { margin-top: 2px; }
  .sec-t { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--tx2); margin: 4px 2px 8px; display: flex; justify-content: space-between; align-items: center; }
  .card { background: var(--sf); border: 1px solid var(--bd); border-radius: var(--r); padding: 16px; box-shadow: var(--sh); animation: rise .4s var(--ease) both; min-width: 0; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .card.hover { transition: transform .18s var(--ease), border-color .18s; } .card.hover:hover { transform: translateY(-2px); border-color: var(--ac); }
  h2.h { margin: 0; font-size: 19px; letter-spacing: -.02em; line-height: 1.28; } p { margin: 0; line-height: 1.55; font-size: 13.5px; }
  .tx2 { color: var(--tx2); } .tx3 { color: var(--tx3); } .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; } .grow { flex: 1; min-width: 0; }
  .tag { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; background: var(--acs); color: var(--ac); white-space: nowrap; }
  .tag.gray { background: var(--sf2); color: var(--tx2); border: 1px solid var(--bd); } .tag.solid { background: var(--ac); color: var(--on-ac); }
  .tag.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); } .tag.err { background: color-mix(in srgb, var(--err) 16%, transparent); color: var(--err); } .tag.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  [data-pal="mono"] .tag.ok, [data-pal="mono"] .tag.err, [data-pal="mono"] .tag.warn { background: var(--sf2); color: var(--tx); border: 1px solid var(--tx); }
  .tag svg { width: 12px; height: 12px; } .chip { display: inline-flex; padding: 4px 10px; border-radius: 8px; background: var(--sf2); border: 1px solid var(--bd); font: 12px var(--mono); color: var(--tx2); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .av { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 800; color: #fff; flex: none; } .av.lg { width: 44px; height: 44px; font-size: 16px; border-radius: 12px; }
  .btn { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--bd); background: var(--sf2); font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 7px; }
  .btn.p { background: var(--ac); border-color: var(--ac); color: var(--on-ac); } .btn.f { flex: 1; padding: 11px 14px; } .btn:active { transform: scale(.985); } .btn svg { width: 15px; height: 15px; }
  .btn.ghost { background: transparent; }
  .seg2 { display: flex; padding: 3px; border-radius: 10px; background: var(--sf2); border: 1px solid var(--bd); gap: 2px; }
  .seg2 button { flex: 1; padding: 6px 10px; border: 0; border-radius: 8px; background: transparent; font-size: 12.5px; font-weight: 600; color: var(--tx2); }
  .seg2 button[aria-pressed=true] { background: var(--sf); color: var(--tx); box-shadow: var(--sh); }
  .kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; } @container (min-width: 600px) { .kpis { grid-template-columns: repeat(4, 1fr); } .two { grid-template-columns: 1fr 1fr !important; } }
  .kpi { background: var(--sf); border: 1px solid var(--bd); border-radius: var(--r); padding: 13px; } .kpi .l { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--tx2); } .kpi .v { font-size: 26px; font-weight: 800; letter-spacing: -.03em; margin-top: 6px; line-height: 1; } .kpi small { display: block; margin-top: 5px; font-size: 11.5px; color: var(--tx3); }
  .quick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .qc { display: flex; align-items: center; gap: 12px; padding: 14px; background: var(--sf); border: 1px solid var(--bd); border-radius: var(--r); text-align: left; box-shadow: var(--sh); position: relative; transition: transform .18s var(--ease), border-color .18s; }
  .qc:hover { transform: translateY(-2px); border-color: var(--ac); } .qc .ic { width: 38px; height: 38px; border-radius: 10px; background: var(--acs); color: var(--ac); display: grid; place-items: center; flex: none; } .qc .ic svg { width: 19px; height: 19px; }
  .qc b { display: block; font-size: 13.5px; } .qc small { color: var(--tx2); font-size: 11.5px; } .qc .bd { position: absolute; top: 8px; right: 9px; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--ac); color: var(--on-ac); font-size: 11px; font-weight: 800; display: grid; place-items: center; }
  .dashed { border: 1.5px dashed var(--bd); border-radius: var(--r); padding: 16px; text-align: center; color: var(--tx2); font-size: 12.5px; }
  .dashed button { margin-top: 10px; background: none; border: 0; color: var(--ac); font-weight: 800; letter-spacing: .06em; font-size: 12px; }
  .bars { display: grid; gap: 11px; } .br { display: grid; grid-template-columns: 1fr auto; gap: 5px 10px; align-items: center; font-size: 13px; } .br .v { font-weight: 700; font-variant-numeric: tabular-nums; } .br .t { grid-column: 1/-1; height: 7px; border-radius: 99px; background: var(--sf2); overflow: hidden; } .br .f { height: 100%; border-radius: 99px; background: var(--ac); transform-origin: left; animation: grow .8s var(--ease) both; } @keyframes grow { from { transform: scaleX(0); } }
  .br .f.ok { background: var(--ok); } .br .f.err { background: var(--err); } .br .f.warn { background: var(--warn); } .br .f.gray { background: var(--tx3); }
  .heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 3px; } .heat i { aspect-ratio: 1; border-radius: 3px; background: var(--h0); animation: pop .5s var(--ease) both; } @keyframes pop { from { opacity: 0; transform: scale(.4); } }
  .heat i[data-l="1"] { background: var(--h1); } .heat i[data-l="2"] { background: var(--h2); } .heat i[data-l="3"] { background: var(--h3); } .heat i[data-l="4"] { background: var(--h4); }
  .legend { display: flex; align-items: center; gap: 4px; justify-content: flex-end; font-size: 11px; color: var(--tx3); margin-top: 8px; } .legend i { width: 11px; height: 11px; border-radius: 3px; background: var(--h0); } .legend i:nth-child(2) { background: var(--h1); } .legend i:nth-child(3) { background: var(--h2); } .legend i:nth-child(4) { background: var(--h3); } .legend i:nth-child(5) { background: var(--h4); }
  .months { display: grid; grid-auto-flow: column; font-size: 11px; color: var(--tx3); margin-bottom: 6px; }
  .feed { display: grid; gap: 10px; } .gday { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--tx3); margin: 6px 2px 0; }
  .fc { display: grid; gap: 9px; } .fc .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; } .fc .ttl { font-weight: 700; font-size: 14px; letter-spacing: -.01em; line-height: 1.35; } .fc .attr { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--tx2); } .fc .acts { display: flex; gap: 8px; margin-top: 2px; }
  .diff { display: flex; gap: 2px; } .diff i { width: 10px; height: 10px; border-radius: 2px; background: var(--ok); } .diff i.r { background: var(--err); } .diff i.g { background: var(--bd); }
  .seglang { display: flex; height: 9px; border-radius: 99px; overflow: hidden; gap: 2px; } .seglang i { height: 100%; animation: grow .8s var(--ease) both; transform-origin: left; }
  .li { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--bd2); } .li:first-child { border-top: 0; padding-top: 2px; } .li b { display: block; font-size: 13.5px; margin-bottom: 2px; } .li p { color: var(--tx2); font-size: 12.5px; }
  .num { width: 24px; height: 24px; border-radius: 50%; background: var(--ac); color: var(--on-ac); display: grid; place-items: center; font-size: 12px; font-weight: 800; flex: none; margin-top: 1px; transition: transform .15s; }
  .li.active .num, .li:hover .num { transform: scale(1.18); } .li.active { background: var(--acs); margin: 0 -8px; padding-left: 8px; padding-right: 8px; border-radius: 8px; }
  .shot { aspect-ratio: 16/9; border-radius: 10px; background: var(--sf2); border: 1px solid var(--bd); position: relative; overflow: hidden; } .shot .w { position: absolute; background: var(--sf); border: 1px solid var(--bd); border-radius: 6px; } .shot .ln { position: absolute; height: 5px; border-radius: 3px; background: var(--bd); }
  .shot .dim { position: absolute; inset: 0; background: rgba(0,0,0,.0); transition: background .2s; } .shot.focus .dim { background: rgba(0,0,0,.42); }
  .shot .pin { position: absolute; width: 24px; height: 24px; border-radius: 50%; background: var(--ac); color: var(--on-ac); display: grid; place-items: center; font-size: 11px; font-weight: 800; box-shadow: 0 0 0 5px var(--acs); transform: translate(-50%,-50%); transition: transform .18s var(--ease), box-shadow .18s; z-index: 2; }
  .shot .pin.on { transform: translate(-50%,-50%) scale(1.3); box-shadow: 0 0 0 8px var(--acs); } .shot .spot { position: absolute; border: 2px solid var(--ac); border-radius: 8px; opacity: 0; transition: opacity .2s; z-index: 1; box-shadow: 0 0 0 999px rgba(0,0,0,.0); } .shot .spot.on { opacity: 1; }
  pre.code { margin: 0; padding: 12px; background: var(--sf2); border: 1px solid var(--bd); border-radius: 10px; font: 12.5px/1.6 var(--mono); overflow-x: auto; position: relative; } .copy { position: absolute; top: 7px; right: 7px; padding: 3px 9px; border-radius: 7px; border: 1px solid var(--bd); background: var(--sf); font-size: 11px; font-weight: 600; color: var(--tx2); }
  .co { display: flex; gap: 11px; padding: 12px; border-radius: 10px; background: var(--sf2); border: 1px solid var(--bd); border-left: 3px solid var(--ac); } .co svg { width: 17px; height: 17px; flex: none; margin-top: 1px; color: var(--ac); } .co b { display: block; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 3px; } .co p { color: var(--tx2); font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; } th { text-align: left; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--tx2); padding: 0 0 8px; } td { padding: 9px 0; border-top: 1px solid var(--bd2); } td:last-child, th:last-child { text-align: right; }
  .src { display: grid; grid-template-columns: auto 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--bd2); } .src:first-child { border-top: 0; padding-top: 2px; } .fav { width: 32px; height: 32px; border-radius: 9px; background: var(--sf2); border: 1px solid var(--bd); display: grid; place-items: center; font-weight: 800; font-size: 12.5px; }
  .cite { display: inline-grid; place-items: center; min-width: 17px; height: 17px; margin: 0 1px; border-radius: 6px; background: var(--acs); color: var(--ac); font-size: 10px; font-weight: 800; vertical-align: 2px; }
  .ring { position: relative; display: grid; place-items: center; flex: none; } .ring svg { transform: rotate(-90deg); } .ring .c { position: absolute; text-align: center; line-height: 1.1; } .ring .c b { font-size: 22px; letter-spacing: -.03em; display: block; } .ring .c small { font-size: 10.5px; color: var(--tx2); text-transform: uppercase; letter-spacing: .08em; }
  .ring circle.t { stroke: var(--sf2); } .ring circle.v { stroke: var(--ac); stroke-linecap: round; animation: ringin 1s var(--ease) both; } @keyframes ringin { from { stroke-dashoffset: var(--len); } }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; } .tl { padding: 11px 8px; border: 1px solid var(--bd); border-radius: 10px; background: var(--sf2); text-align: center; font-size: 11.5px; font-weight: 600; } .tl .lt { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; margin: 0 auto 6px; color: #fff; font-weight: 800; } .tl small { display: block; color: var(--tx3); font-weight: 500; margin-top: 2px; }
  .bubble { padding: 11px 13px; border-radius: 14px 14px 14px 5px; background: var(--sf2); border: 1px solid var(--bd); font-size: 14px; line-height: 1.5; }
  .choice { display: flex; align-items: center; gap: 13px; padding: 13px; border: 1px solid var(--bd); border-radius: 12px; background: var(--sf2); width: 100%; text-align: left; margin-bottom: 8px; transition: border-color .15s, transform .15s; } .choice:hover { border-color: var(--ac); transform: translateX(2px); } .choice .num { width: 28px; height: 28px; font-size: 14px; margin: 0; }
  .checks { display: grid; gap: 0; } .ck { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--bd2); font-size: 13px; } .ck:first-child { border-top: 0; } .ck .st { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; flex: none; } .ck .st svg { width: 11px; height: 11px; } .ck .st.ok { background: var(--ok); color: var(--bg); } .ck .st.run { border: 2px solid var(--warn); border-top-color: transparent; animation: spin .9s linear infinite; } .ck .st.no { background: var(--err); color: var(--bg); } @keyframes spin { to { transform: rotate(360deg); } }
  [data-pal="mono"] .ck .st.ok, [data-pal="mono"] .ck .st.no { background: var(--tx); }
  svg.radar text { fill: var(--tx2); font-size: 10.5px; font-weight: 600; } svg.radar .grid { fill: none; stroke: var(--bd); } svg.radar .area { fill: var(--acs); stroke: var(--ac); stroke-width: 2; animation: rise .8s var(--ease) both; } svg.radar circle.p { fill: var(--ac); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body data-theme="dark" data-pal="gh">

<aside id="lab">
  <h1>Sidebar v2</h1>
  <p class="sub">Inspired by the GitHub dashboard sidebar. Same system for every view; mock data. Header has no dock or close buttons.</p>

  V.stack = { label: 'Reverse engineer', icon: 'layers', title: 'Tech stack', sub: 'example.com · 11 technologies', notes: ['The stack view, in this style: a confidence ring, a tile grid of technologies with their own colour logos, header checks as a checklist.'],

      <section class="card"><div class="row" style="gap:16px;flex-wrap:nowrap">${ring(87, 'Sure', 92)}<div class="grow"><h2 class="h" style="font-size:16px">A React site on Next.js, served by Vercel behind Cloudflare.</h2><div class="row" style="margin-top:10px">${tag('11 found', '', 'layers')}${tag('5 / 7 headers', 'warn', 'shield')}</div></div></div></section>
      <section class="card"><div class="sec-t" style="margin-top:0">Technologies</div><div class="tiles">${[['R', '#2f9fd1', 'React', '96 %'], ['N', '#111', 'Next.js', '88 %'], ['V', '#222', 'Vercel', '84 %'], ['C', '#f6821f', 'Cloudflare', '74 %'], ['T', '#06b6d4', 'Tailwind', '70 %'], ['G', '#e37400', 'Analytics', '58 %']].map(([l, c, n, p]) => `<div class="tl"><div class="lt" style="background:${c}">${l}</div>${n}<small>${p}</small></div>`).join('')}</div></section>
      <section class="card"><div class="sec-t" style="margin-top:0">Security headers</div><div class="checks"><div class="ck"><span class="st ok">${ic('check')}</span><span class="grow">Strict-Transport-Security</span><span class="tx3">present</span></div><div class="ck"><span class="st ok">${ic('check')}</span><span class="grow">Content-Security-Policy</span><span class="tx3">present</span></div><div class="ck"><span class="st no">${ic('x')}</span><span class="grow">X-Frame-Options</span><span class="tx3">missing</span></div></div></section>
      <section class="card"><div class="sec-t" style="margin-top:0">Page weight</div><div class="bars">${bar('Scripts', 62, '0.9 MB')}${bar('Images', 28, '0.4 MB', 'gray')}${bar('Other', 10, '0.1 MB', 'gray')}</div></section>`
  };
  V.answer = { label: 'Answer', icon: 'spark', title: 'Answer', sub: 'Nexus', actions: 'answer', notes: ['New: a TL;DR card first, then the detail. Table, callouts and code in the same system; Read aloud and Copy pinned at the bottom.'],
    render: () => html`
      <section class="card" style="border-left:3px solid var(--ac)"><div class="tx3" style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;margin-bottom:6px">TL;DR</div><p style="font-size:15px;font-weight:600">The wake word heard you every time; the second check failed three times because the network dropped.</p></section>
      <section class="card"><h2 class="h">What the log shows</h2><table style="margin-top:12px"><thead><tr><th>Cause</th><th>Seen</th></tr></thead><tbody><tr><td>Speech check timed out</td><td><b>3×</b></td></tr><tr><td>Local server not found</td><td><b>2×</b></td></tr><tr><td>Mic silent at start</td><td><b>1×</b></td></tr></tbody></table></section>
      <div class="co">${ic('info')}<div><b>Note</b><p>The wake model scored 0.71 to 0.99 against a 0.68 threshold.</p></div></div>
      <div class="co" style="border-left-color:var(--warn)">${ic('alert')}<div><b style="color:var(--warn)">Important</b><p>If Groq is unreachable, the offline server must be ready within 15 seconds.</p></div></div>
      <section class="card"><pre class="code">${copy}<span style="color:var(--tx3)">// try every candidate, not only the first</span>
candidates.into_iter().find(|p| p.exists())</pre></section>`
  };
  V.confirm = { label: 'Confirmation', icon: 'shield', title: 'Approval needed', sub: 'WhatsApp', actions: 'confirm', notes: ['New: the exact message as it will be sent, and the voice window as a ring that counts down 5 seconds (say “yes” or “cancel”).'],
    render: () => html`
      <section class="card"><div class="row" style="margin-bottom:12px">${tag('WhatsApp', 'solid', 'spark')}${tag('Approval required', 'warn', 'shield')}</div><h2 class="h">Send this message to Mummy?</h2><p class="tx2" style="margin:8px 0 14px">It goes out as soon as you confirm and cannot be unsent from here.</p><div class="bubble">Reached the hostel. I will call after dinner.</div><div class="row" style="margin-top:14px;gap:16px;flex-wrap:nowrap">${ring(100, 'sec', 70, 6).replace('<b>100%</b>', '<b id="cd">5</b>')}<div class="tx2" style="font-size:12.5px;line-height:1.45">${ic('mic').replace('<svg', '<svg style="width:13px;height:13px;vertical-align:-2px"')} Say <b style="color:var(--tx)">“yes”</b> or <b style="color:var(--tx)">“cancel”</b>.<br>The window closes in 5 seconds; the buttons stay.</div></div></section>`
  };
  V.choices = { label: 'Which one?', icon: 'mic', title: 'Which one?', sub: 'Say one, two or three', notes: ['Large numbered rows that are exactly what can be said. Used for app names that sound alike and for desktop controls.'],
    render: () => html`
      <section class="card"><h2 class="h" style="margin-bottom:6px">Which Chrome?</h2><p class="tx2" style="margin-bottom:14px">Two apps sound alike. Say the number.</p>
        <button class="choice" type="button"><span class="num">1</span><div class="grow"><b style="font-size:14.5px">Google Chrome</b><div class="tx3" style="font-size:12px">Installed · used 14 times</div></div>${ic('arrow').replace('<svg', '<svg style="width:16px;height:16px"')}</button>
        <button class="choice" type="button"><span class="num">2</span><div class="grow"><b style="font-size:14.5px">Chrome Remote Desktop</b><div class="tx3" style="font-size:12px">Installed · used once</div></div>${ic('arrow').replace('<svg', '<svg style="width:16px;height:16px"')}</button>
        <button class="choice" type="button"><span class="num">3</span><div class="grow"><b style="font-size:14.5px">Neither</b><div class="tx3" style="font-size:12px">Cancel this request</div></div>${ic('x').replace('<svg', '<svg style="width:16px;height:16px"')}</button></section>`
  };

  const ORDER = ['home', 'prlist', 'pr', 'repo', 'screen', 'research', 'stack', 'answer', 'confirm', 'choices'];
  const PINS = { pr: `<button class="btn f" type="button">Comment</button><button class="btn f" type="button">Approve</button><button class="btn p f" type="button">${ic('merge')}Merge <span class="k">M</span></button>`, answer: `<button class="btn f" type="button">${ic('mic')}Read aloud</button><button class="btn f" type="button">${ic('copy')}Copy</button>`, confirm: `<button class="btn f" type="button">${ic('x')}Cancel</button><button class="btn p f" type="button">${ic('check')}Send message</button>` };
  const nav = $('#nav'); nav.innerHTML = ORDER.map((id) => `<button type="button" data-id="${id}" aria-pressed="false"><span class="dot"></span>${V[id].label}</button>`).join('');
  let cur = 'home', cdTimer = null;
  function show(id) {
    cur = id; const v = V[id];
    nav.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.id === id)));
    $('#hdr').innerHTML = `<div class="lg">${ic(v.icon)}</div><div class="tt"><b>${v.title}</b><span>${v.sub}</span></div>${v.back ? `<button class="back" type="button" data-go="${v.back}">${ic('arrow')}Back</button>` : ''}`;
    $('#body').innerHTML = v.render(); $('#body').scrollTop = 0;
    const p = $('#pins'); if (v.actions) { p.innerHTML = PINS[v.actions]; p.hidden = false; } else { p.hidden = true; p.innerHTML = ''; }
    $('#notes').innerHTML = `<b>${v.label}</b><ul>${v.notes.map((n) => `<li>${n}</li>`).join('')}</ul>`;
    const lb = $('#loadbar'); lb.classList.remove('on'); void lb.offsetWidth; lb.classList.add('on'); history.replaceState(null, '', '#' + id);
    clearInterval(cdTimer); if (id === 'confirm') { let n = 5; cdTimer = setInterval(() => { n = n <= 1 ? 5 : n - 1; const e = $('#cd'); if (e) e.textContent = n; }, 1000); }
    wire();
  }
  function wire() {
    const shot = $('#shot'); if (shot) {
      const set = (i) => { shot.classList.toggle('focus', !!i); shot.querySelectorAll('.pin').forEach((p) => p.classList.toggle('on', p.dataset.p === String(i))); shot.querySelectorAll('.spot').forEach((s) => s.classList.toggle('on', s.dataset.s === String(i))); document.querySelectorAll('#items .li').forEach((l) => l.classList.toggle('active', l.dataset.i === String(i))); };
      document.querySelectorAll('#items .li').forEach((l) => { l.addEventListener('mouseenter', () => set(l.dataset.i)); l.addEventListener('mouseleave', () => set(0)); });
      shot.querySelectorAll('.pin').forEach((p) => { p.addEventListener('mouseenter', () => set(p.dataset.p)); p.addEventListener('mouseleave', () => set(0)); });
    }
  }
  document.addEventListener('click', (e) => {
    const g = e.target.closest('[data-go]'); if (g && V[g.dataset.go]) { show(g.dataset.go); return; }
    const sp = e.target.closest('.seg2 button'); if (sp) sp.parentElement.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === sp)));
    const cp = e.target.closest('.copy'); if (cp) { const t = cp.textContent; cp.textContent = 'Copied'; setTimeout(() => { cp.textContent = t; }, 1100); }
    const nb = e.target.closest('#nav button'); if (nb) show(nb.dataset.id);
  });
  function bind(id, fn) { $(id).addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; $(id).querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); fn(b.dataset.v); }); }
  bind('#pal', (v) => { document.body.dataset.pal = v; }); bind('#theme', (v) => { document.body.dataset.theme = v; }); bind('#width', (v) => { $('#frame').style.setProperty('--w', v + 'px'); });
  addEventListener('keydown', (e) => { const i = ORDER.indexOf(cur); if (e.key === 'ArrowDown') { e.preventDefault(); show(ORDER[(i + 1) % ORDER.length]); } if (e.key === 'ArrowUp') { e.preventDefault(); show(ORDER[(i + ORDER.length - 1) % ORDER.length]); } if (e.key === 't' || e.key === 'T') { const d = document.body.dataset.theme === 'dark' ? 'light' : 'dark'; document.body.dataset.theme = d; $('#theme').querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === d))); } if (e.key === 'p' || e.key === 'P') { const d = document.body.dataset.pal === 'gh' ? 'mono' : 'gh'; document.body.dataset.pal = d; $('#pal').querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === d))); } });
  show(ORDER.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'home');
  window.__v2 = { show, V, ORDER };
})();
</script>
</body>
