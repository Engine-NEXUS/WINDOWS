<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark light" />
    <script src="/theme-boot.js"></script>
    <title>Speech pill preview (dev only)</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: #0e0e12;
        color: #f1f1f1;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .controls {
        display: flex;
        gap: 12px;
        margin-bottom: 24px;
      }
      button {
        padding: 8px 16px;
        border-radius: 6px;
        border: 1px solid #3a3a42;
        background: #1e1e24;
        color: #ffffff;
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
      }
      button:hover {
        background: #2b2b34;
      }
      .stage-preview {
        position: relative;
        width: 100%;
        height: 240px;
        border: 1px dashed #3a3a42;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/stage/devSpeechPill.tsx"></script>
