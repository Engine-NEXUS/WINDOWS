[package]
name = "nexus-desktop-control-offline"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
tracing = "0.1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt","time","macros","sync"] }

[features]
native-typecheck = []

[target.'cfg(windows)'.dependencies]
uiautomation = "0.25"
windows = { version = "0.36", features = ["Win32_Foundation","Win32_System_Threading","Win32_Security","Win32_UI_WindowsAndMessaging"] }

