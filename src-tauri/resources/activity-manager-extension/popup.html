<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexus Activity Manager</title>
<style>body{width:270px;padding:16px;margin:0;background:#17171d;color:#f6f6f8;font:13px system-ui}h1{font-size:17px;margin:0 0 8px}p{color:#aaaab5;line-height:1.4}label{display:block;margin:13px 0 5px}input,select,button{box-sizing:border-box;width:100%;padding:9px;border-radius:8px;border:1px solid #454550;background:#25252d;color:inherit;font:inherit}button{margin-top:14px;background:#316cef;border:0;cursor:pointer}#status{min-height:18px}</style>
</head><body><h1>Nexus Activity Manager</h1><p>Send only the domain of the focused normal browser tab to Nexus on this computer. Private windows are excluded.</p><label for="browser">This browser</label><select id="browser"><option value="chrome">Chrome</option><option value="brave">Brave</option><option value="edge">Edge</option></select><label for="token">Nexus connection code</label><input id="token" type="password" autocomplete="off" spellcheck="false"><button id="save">Save connection</button><p id="status" role="status"></p><script src="popup.js"></script></body></html>
